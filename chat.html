<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KH AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#e0e0e0;font-family:monospace;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#intro{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s ease,transform .8s ease}
#intro.hide{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .mark{font-size:clamp(36px,10vw,68px);font-weight:800;letter-spacing:.22em;color:#fff;text-shadow:0 0 10px rgba(255,0,51,.9),0 0 28px rgba(255,0,51,.55),0 0 70px rgba(255,0,51,.3);animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes markIn{0%{opacity:0;transform:scale(.82);filter:blur(14px);letter-spacing:.6em}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);letter-spacing:.22em}}
#intro .sub{font-size:11px;letter-spacing:.5em;color:#ff0033;text-transform:uppercase;opacity:0;animation:subIn .9s ease .55s both}
@keyframes subIn{from{opacity:0;transform:translateY(8px)}to{opacity:.85;transform:translateY(0)}}
#intro .bar{width:min(240px,60vw);height:2px;background:#1a1a1a;overflow:hidden;border-radius:2px;opacity:0;animation:subIn .6s ease .8s both}
#intro .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#ff0033,transparent);animation:sweep 1.1s linear infinite}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;opacity:0;transition:opacity .7s ease}
#app.show{opacity:1}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1a1a1a;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);z-index:100}
.hleft{display:flex;align-items:center;gap:10px}
.menu-btn{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid #222;border-radius:8px;color:#909090;cursor:pointer}
.menu-btn:hover{color:#ff0033;border-color:#8a0d20}
.menu-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;letter-spacing:.15em;font-size:13px}
.brand svg{width:24px;height:24px}
.hright{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;border:1px solid #ff0033;object-fit:cover;background:#0a0a0a}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:#0a0a0a;border-right:1px solid #1a1a1a;z-index:200;transition:left .3s ease;display:flex;flex-direction:column}
.sidebar.open{left:0}
.sb-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #1a1a1a}
.sb-head h2{font-size:12px;letter-spacing:.2em;color:#fff;text-transform:uppercase}
.sb-close{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:0;color:#909090;cursor:pointer}
.sb-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.sb-user{padding:14px 16px;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;gap:10px}
.sb-user img{width:36px;height:36px;border-radius:50%;border:1px solid #ff0033;background:#121212}
.sb-user-info{flex:1;overflow:hidden}
.sb-user-info .name{color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-info .email{color:#606060;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-new{margin:12px;padding:12px;background:#ff0033;color:#000;border:0;border-radius:8px;font-family:monospace;font-weight:700;font-size:12px;letter-spacing:.1em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 18px rgba(255,0,51,.35)}
.sb-new:hover{box-shadow:0 0 28px rgba(255,0,51,.7)}
.sb-new svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sb-list{flex:1;overflow-y:auto;padding:8px}
.sb-list::-webkit-scrollbar{width:5px}
.sb-list::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:5px}
.sb-item{padding:10px 12px;margin-bottom:4px;background:transparent;border:1px solid transparent;border-radius:8px;color:#c0c0c0;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:.2s}
.sb-item:hover{background:#121212;border-color:#222}
.sb-item.active{background:#121212;border-color:#ff0033;color:#fff}
.sb-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .del{opacity:0;width:20px;height:20px;display:grid;place-items:center;background:transparent;border:0;color:#606060;cursor:pointer;flex-shrink:0}
.sb-item:hover .del{opacity:1}
.sb-item .del:hover{color:#ff0033}
.sb-item .del svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sb-empty{text-align:center;padding:30px 16px;color:#4a4a4a;font-size:11px;letter-spacing:.1em}
.sb-logout{margin:12px;padding:10px;background:transparent;border:1px solid #222;border-radius:8px;color:#909090;font-family:monospace;font-size:11px;cursor:pointer;letter-spacing:.1em}
.sb-logout:hover{border-color:#ff0033;color:#ff0033}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;display:none}
.overlay.show{display:block}
main{flex:1;overflow-y:auto;padding:20px 16px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:6px}
main::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:20px 0;animation:fadeIn .8s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.hero.hidden{display:none}
.stage{width:200px;height:200px;margin:10px auto 24px;position:relative;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px solid;pointer-events:none}
.ring1{inset:0;border-color:rgba(255,0,51,.35);box-shadow:0 0 24px rgba(255,0,51,.2),inset 0 0 24px rgba(255,0,51,.12);animation:spinA 14s linear infinite}
.ring2{inset:20px;border-color:rgba(255,0,51,.5);box-shadow:0 0 20px rgba(255,0,51,.25),inset 0 0 20px rgba(255,0,51,.15);animation:spinB 10s linear infinite reverse}
.ring3{inset:40px;border-color:rgba(255,0,51,.7);box-shadow:0 0 26px rgba(255,0,51,.35),inset 0 0 26px rgba(255,0,51,.2);animation:spinA 7s linear infinite}
.ring::before{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#ff0033;top:-3px;left:50%;transform:translateX(-50%);box-shadow:0 0 14px #ff0033,0 0 28px rgba(255,0,51,.7)}
.ring2::before{background:#fff}
.ring3::before{background:#ff3355}
@keyframes spinA{to{transform:rotate(360deg)}}
@keyframes spinB{to{transform:rotate(360deg)}}
.core{width:120px;height:120px;position:relative;z-index:3}
.hero h1{font-size:clamp(30px,9vw,52px);font-weight:800;letter-spacing:.08em;color:#fff;text-shadow:0 0 24px rgba(255,0,51,.6);margin-bottom:10px}
.hero h1 span{color:#ff0033}
.hero .sub{font-size:clamp(12px,3vw,14px);color:#808080;margin-bottom:24px}
footer{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.9);backdrop-filter:blur(14px);border-top:1px solid #1e1e1e;z-index:100}
.ibox{max-width:820px;margin:0 auto;background:#0a0a0a;border:1px solid #222;border-radius:20px;padding:12px 14px}
.ibox:focus-within{border-color:rgba(255,0,51,.55);box-shadow:0 0 0 3px rgba(255,0,51,.08)}
.ibox textarea{width:100%;background:transparent;border:0;outline:0;resize:none;color:#e8e8e8;font-family:monospace;font-size:14px;line-height:1.6;max-height:150px;padding:4px 0}
.ibox textarea::placeholder{color:#4a4a4a}
.ibox .bar{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid #181818}
.usage{font-size:11px;color:#909090;letter-spacing:.1em}
.usage b{color:#ff0033}
.send{width:34px;height:34px;display:grid;place-items:center;background:#ff0033;border:0;border-radius:9px;cursor:pointer;box-shadow:0 0 18px rgba(255,0,51,.45)}
.send:disabled{background:#1e1e1e;box-shadow:none;cursor:not-allowed}
.send svg{width:15px;height:15px}
.send svg path{fill:#000}
.disc{text-align:center;font-size:10px;color:#4a4a4a;margin-top:10px}
.row{display:flex;flex-direction:column;animation:in .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.row.user{align-items:flex-end}
.row.ai{align-items:flex-start}
.tools-bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.tag{font-size:9px;letter-spacing:.22em;color:#ff0033;text-transform:uppercase;opacity:.85}
.action{padding:3px 9px;font-family:monospace;font-size:10px;color:#909090;background:#0a0a0a;border:1px solid #222;border-radius:6px;cursor:pointer}
.action:hover{color:#ff0033;border-color:#8a0d20}
.action.done{color:#ff3355;border-color:#ff0033;background:rgba(255,0,51,.12)}
.bubble{max-width:100%;padding:14px 17px;border-radius:14px;font-size:14px;line-height:1.72;word-break:break-word}
.user .bubble{background:#0f0f0f;border:1px solid #222;border-bottom-right-radius:4px;color:#d8d8d8;white-space:pre-wrap}
.ai .bubble{background:#0a0a0a;border:1px solid #1a1a1a;border-bottom-left-radius:4px}
.codeblock{margin:12px 0;background:#050505;border:1px solid #1e1e1e;border-radius:10px;overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d0d0d;border-bottom:1px solid #1a1a1a}
.codelang{font-size:10px;letter-spacing:.2em;color:#ff0033;text-transform:uppercase;font-weight:700}
.codebtns{display:flex;gap:6px}
.codebtn{padding:4px 10px;font-family:monospace;font-size:10px;color:#909090;background:#121212;border:1px solid #222;border-radius:6px;cursor:pointer}
.codebtn:hover{color:#ff0033;border-color:#8a0d20}
.codebtn.done{color:#ff3355;border-color:#ff0033;background:rgba(255,0,51,.12)}
.codebtn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:4px}
pre{padding:14px;overflow-x:auto;font-family:'Courier New',monospace;font-size:12.5px;line-height:1.6;color:#d8d8d8}
pre::-webkit-scrollbar{height:6px}
pre::-webkit-scrollbar-thumb{background:#222;border-radius:6px}
code{font-family:'Courier New',monospace}
.loader{padding:15px 17px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:14px;border-bottom-left-radius:4px;min-width:190px}
.track{position:relative;height:3px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin-bottom:10px}
.track i{position:absolute;top:0;left:0;height:100%;width:30%;background:linear-gradient(90deg,transparent,#ff0033,transparent);animation:scan 1.15s linear infinite}
@keyframes scan{from{transform:translateX(-130%)}to{transform:translateX(430%)}}
.lbl{font-size:10px;letter-spacing:.26em;color:#ff0033;text-transform:uppercase;opacity:.9}
.cursor{display:inline-block;width:7px;height:12px;background:#ff0033;animation:blink .9s steps(1) infinite;vertical-align:middle;margin-left:6px}
@keyframes blink{50%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:28px;max-width:420px;width:100%;text-align:center}
.modal-box h3{color:#fff;font-size:16px;letter-spacing:.1em;margin-bottom:14px}
.modal-box p{color:#909090;font-size:13px;margin-bottom:20px;line-height:1.7}
.modal-box .price{color:#ff0033;font-size:28px;font-weight:800;margin:12px 0;text-shadow:0 0 20px rgba(255,0,51,.5)}
.modal-box .price span{font-size:12px;color:#909090;font-weight:400}
.modal-btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
.modal-btns button{padding:12px 24px;border-radius:8px;font-family:monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;border:1px solid #222;background:transparent;color:#909090}
.modal-btns button:hover{border-color:#ff0033;color:#ff0033}
.modal-btns .primary{background:#ff0033;color:#000;border-color:#ff0033;font-weight:700}
@media(max-width:600px){main{padding:14px 12px}.bubble{font-size:13.5px}header{padding:10px 12px}.stage{width:170px;height:170px}.core{width:100px;height:100px}.ring2{inset:16px}.ring3{inset:32px}}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="intro">
  <div class="mark">KH AI</div>
  <div class="sub">Initializing Core</div>
  <div class="bar"><i></i></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <h2>Menu</h2>
    <button class="sb-close" id="sbClose"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sb-user">
    <img id="sbAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff0033'/%3E%3C/svg%3E" alt="">
    <div class="sb-user-info">
      <div class="name" id="sbName">User</div>
      <div class="email" id="sbEmail">-</div>
    </div>
  </div>
  <button class="sb-new" id="sbNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Chat Baru</button>
  <div class="sb-list" id="sbList"></div>
  <button class="sb-logout" id="logoutBtn">KELUAR</button>
</div>

<div class="modal" id="upgradeModal">
  <div class="modal-box">
    <h3>LIMIT HABIS</h3>
    <p>Kamu udah pakai 10 request hari ini. Tunggu besok atau hubungi admin untuk upgrade.</p>
    <div class="price">Rp 25.000 <span>/ bulan</span></div>
    <div class="modal-btns">
      <button onclick="document.getElementById('upgradeModal').classList.remove('show')">Tutup</button>
      <button class="primary" onclick="alert('Hubungi admin untuk upgrade.')">Upgrade</button>
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div class="hleft">
      <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="brand">
        <svg viewBox="0 0 40 40"><path d="M20 3 L35 11 L35 27 L20 35 L5 27 L5 11 Z" fill="none" stroke="#ff0033" stroke-width="2"/><path d="M20 10 L20 30 M12 15 L28 25 M28 15 L12 25" stroke="#ff0033" stroke-width="1.6" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#ff0033"/></svg>
        KH AI
      </div>
    </div>
    <div class="hright">
      <img class="avatar" id="headerAvatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff0033'/%3E%3C/svg%3E" alt="">
    </div>
  </header>

  <main id="chat">
    <div class="wrap" id="wrap">
      <div class="hero" id="hero">
        <div class="stage">
          <div class="ring ring1"></div>
          <div class="ring ring2"></div>
          <div class="ring ring3"></div>
          <svg class="core" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="neon"><feGaussianBlur stdDeviation="1.5" result="b1"/><feGaussianBlur stdDeviation="2.8" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="bglow"><feGaussianBlur stdDeviation="1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <g filter="url(#neon)"><polygon points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29" fill="none" stroke="#ff0033" stroke-width="1.6"/></g>
            <g filter="url(#neon)"><line x1="50" y1="50" x2="50" y2="12" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/><line x1="50" y1="50" x2="83" y2="31" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/><line x1="50" y1="50" x2="83" y2="69" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/><line x1="50" y1="50" x2="50" y2="88" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/><line x1="50" y1="50" x2="17" y2="69" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/><line x1="50" y1="50" x2="17" y2="31" stroke="#ff0033" stroke-width="0.8" opacity="0.5"/></g>
            <g transform="rotate(0 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <g transform="rotate(60 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" begin=".2s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <g transform="rotate(120 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" begin=".4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <g transform="rotate(180 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" begin=".6s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <g transform="rotate(240 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" begin=".8s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <g transform="rotate(300 50 50)"><g><animateTransform attributeName="transform" type="translate" values="0 -18; 0 -32; 0 -18" dur="2.4s" repeatCount="indefinite" begin="1s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/><circle cx="50" cy="50" r="2.8" fill="#fff" filter="url(#bglow)"/></g></g>
            <circle cx="50" cy="50" r="2.5" fill="#ff0033" filter="url(#neon)"/>
          </svg>
        </div>
        <h1>KH <span>AI</span></h1>
        <p class="sub">Apa yang bisa saya bantu?</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="ibox">
      <textarea id="in" rows="1" placeholder="Ketik perintah..."></textarea>
      <div class="bar">
        <div class="usage" id="usage">Kredit: <b>10</b>/10</div>
        <button class="send" id="send"><svg viewBox="0 0 24 24"><path d="M3 20.5L21 12 3 3.5 3 10l12 2-12 2z"/></svg></button>
      </div>
    </div>
    <div class="disc">KH AI dapat membuat kesalahan. Periksa info penting.</div>
  </footer>
  </div>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== CONFIG ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAPx6XY8CRDrS8sxh00uNjWsymTu8jD95M",
  authDomain: "khai-b6e18.firebaseapp.com",
  projectId: "khai-b6e18",
  storageBucket: "khai-b6e18.firebasestorage.app",
  messagingSenderId: "903942429337",
  appId: "1:903942429337:web:9a21b3b38c7bc917be3608"
};

const WORKER_URL = "https://kh-backend-liard.vercel.app/api/chat";

const fbApp = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(fbApp);

let currentUser = null;
let idToken = null;
let chats = [], currentChatId = null, hist = [], busy = false;
let usage = { used: 0, limit: 10, premium: false };

/* ===== INTRO ===== */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("intro").classList.add("hide");
    document.getElementById("app").classList.add("show");
  }, 2400);
});

/* ===== AUTH CHECK ===== */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    idToken = await user.getIdToken();
    const av = user.photoURL || "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff0033'/%3E%3C/svg%3E";
    document.getElementById("headerAvatar").src = av;
    document.getElementById("sbAvatar").src = av;
    document.getElementById("sbName").textContent = user.displayName || "User";
    document.getElementById("sbEmail").textContent = user.email || "-";
    loadChats();
    updateUsage();
  } else {
    window.location.href = "login.html";
  }
});

/* ===== BACKGROUND ===== */
const cv=document.getElementById("bg"),cx=cv.getContext("2d");
let W,H,dr=[],bo=[],lB=0,nB=4000;
function rz(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(d,0,0,d,0,0);const n=Math.round(Math.min(Math.max(W/18,35),90));dr=[];for(let i=0;i<n;i++)dr.push(mk(true));}
function mk(s){return{x:Math.random()*W,y:s?Math.random()*H:-Math.random()*H*.4,len:20+Math.random()*120,sp:1.5+Math.random()*5,al:.04+Math.random()*.24,w:Math.random()<.1?2:1,c:Math.random()<.45?"r":"g"};}
function mb(){const sx=Math.random()*W,p=[{x:sx,y:-30}];let a=sx,b=-30;while(b<H+40){b+=22+Math.random()*48;a+=(Math.random()-.5)*72;p.push({x:a,y:b});}bo.push({p:p,l:1,d:.05+Math.random()*.05,w:Math.random()<.3?2:1.1,c:Math.random()<.6?"r":"g"});}
function drw(){cx.lineCap="round";for(let i=0;i<dr.length;i++){const d=dr[i],g=cx.createLinearGradient(d.x,d.y,d.x,d.y+d.len);if(d.c==="r"){g.addColorStop(0,"rgba(255,0,51,0)");g.addColorStop(.45,"rgba(255,0,51,"+d.al*.7+")");g.addColorStop(1,"rgba(255,80,110,"+d.al+")");}else{g.addColorStop(0,"rgba(128,128,128,0)");g.addColorStop(.45,"rgba(128,128,128,"+d.al*.7+")");g.addColorStop(1,"rgba(180,180,180,"+d.al+")");}cx.strokeStyle=g;cx.lineWidth=d.w;cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x,d.y+d.len);cx.stroke();d.y+=d.sp;if(d.y>H+40){const n=mk(false);d.x=n.x;d.y=n.y;d.len=n.len;d.sp=n.sp;d.al=n.al;d.w=n.w;d.c=n.c;}}
for(let i=bo.length-1;i>=0;i--){const b=bo[i],a=Math.max(b.l,0);cx.save();cx.globalAlpha=a;if(b.c==="r"){cx.shadowBlur=20;cx.shadowColor="rgba(255,0,51,.9)";cx.strokeStyle="rgba(255,60,90,"+(.85*a)+")";}else{cx.shadowBlur=14;cx.shadowColor="rgba(180,180,180,.8)";cx.strokeStyle="rgba(200,200,200,"+(.7*a)+")";}cx.lineWidth=b.w;cx.lineJoin="miter";cx.beginPath();cx.moveTo(b.p[0].x,b.p[0].y);for(let p=1;p<b.p.length;p++)cx.lineTo(b.p[p].x,b.p[p].y);cx.stroke();cx.shadowBlur=0;cx.strokeStyle="rgba(255,255,255,"+(.5*a)+")";cx.lineWidth=b.w*.35;cx.stroke();cx.restore();b.l-=b.d;if(b.l<=0)bo.splice(i,1);}}
function lp(ts){cx.clearRect(0,0,W,H);cx.fillStyle="#000";cx.fillRect(0,0,W,H);drw();if(ts-lB>nB){mb();lB=ts;nB=4000+Math.random()*8000;if(Math.random()<.12)setTimeout(mb,120);}requestAnimationFrame(lp);}
rz();addEventListener("resize",rz);requestAnimationFrame(lp);

/* ===== STORAGE ===== */
function loadChats(){try{const k="khai_chats_"+(currentUser?currentUser.email:"guest");chats=JSON.parse(localStorage.getItem(k)||"[]");}catch(e){chats=[];}renderSidebar();}
function saveChats(){const k="khai_chats_"+(currentUser?currentUser.email:"guest");localStorage.setItem(k,JSON.stringify(chats));}
function updateUsage(){document.getElementById("usage").innerHTML='Kredit: <b>'+Math.max(0,usage.limit-usage.used)+'</b>/'+usage.limit;}

/* ===== HELPER ===== */
function bt(){chat.scrollTop=chat.scrollHeight;}
function ag(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,150)+"px";}
function hideHero(){if(hero)hero.classList.add("hidden");}
function showHero(){if(hero)hero.classList.remove("hidden");}

/* ===== MARKDOWN ===== */
function parseMarkdown(text){
  let html=text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const ic=[];
  html=html.replace(/`([^`\n]+?)`/g,function(m,c){ic.push(c);return "\u0000IC"+(ic.length-1)+"\u0000";});
  html=html.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  html=html.replace(/__(.+?)__/g,"<strong>$1</strong>");
  html=html.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1<em>$2</em>");
  html=html.replace(/(^|[^_])_([^_\n]+?)_(?!_)/g,"$1<em>$2</em>");
  html=html.replace(/~~(.+?)~~/g,'<span style="text-decoration:line-through;opacity:.7;">$1</span>');
  html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:#ff0033;text-decoration:underline;">$1</a>');
  html=html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:8px 0;display:block;">');
  html=html.replace(/^### (.+)$/gm,'<div style="font-size:15px;font-weight:700;color:#fff;margin:12px 0 6px;">$1</div>');
  html=html.replace(/^## (.+)$/gm,'<div style="font-size:17px;font-weight:700;color:#fff;margin:14px 0 8px;">$1</div>');
  html=html.replace(/^# (.+)$/gm,'<div style="font-size:20px;font-weight:800;color:#fff;margin:16px 0 10px;">$1</div>');
  html=html.replace(/^---+$/gm,'<hr style="border:0;border-top:1px solid #2a2a2a;margin:14px 0;">');
  html=html.replace(/^&gt; (.+)$/gm,'<div style="border-left:3px solid #ff0033;padding:6px 12px;margin:8px 0;color:#b0b0b0;font-style:italic;background:rgba(255,0,51,.04);border-radius:0 6px 6px 0;">$1</div>');
  html=html.replace(/^(\s*)[-\*\+] (.+)$/gm,function(m,i,c){const p=16+(i.length*8);return '<div style="padding-left:'+p+'px;position:relative;margin:3px 0;color:#d8d8d8;"><span style="position:absolute;left:'+(p-12)+'px;color:#ff0033;">•</span>'+c+'</div>';});
  html=html.replace(/^(\s*)(\d+)\. (.+)$/gm,function(m,i,n,c){const p=16+(i.length*8);return '<div style="padding-left:'+p+'px;position:relative;margin:3px 0;color:#d8d8d8;"><span style="position:absolute;left:'+(p-14)+'px;color:#ff0033;font-weight:700;">'+n+'.</span>'+c+'</div>';});
  html=html.replace(/\n/g,"<br>");
  html=html.replace(/\u0000IC(\d+)\u0000/g,function(m,i){return '<code style="background:#151515;padding:2px 6px;border-radius:4px;color:#ff5577;font-size:12.5px;border:1px solid #222;">'+ic[parseInt(i)]+'</code>';});
  return html;
}

/* ===== RENDER ===== */
function renderContent(text){
  const container=document.createElement("div");
  const parts=text.split(/```/);
  for(let i=0;i<parts.length;i++){
    if(i%2===0){
      if(parts[i].trim()){
        const p=document.createElement("div");
        p.style.whiteSpace="pre-wrap";
        p.innerHTML=parseMarkdown(parts[i]);
        container.appendChild(p);
      }
    } else {
      const block=parts[i];
      const lines=block.split("\n");
      let lang="code",code=block;
      if(lines[0]&&lines[0].trim()&&!lines[0].includes(" ")&&lines[0].length<20){lang=lines[0].trim().toLowerCase();code=lines.slice(1).join("\n");}
      code=code.replace(/^\n+|\n+$/g,"");
      const cb=document.createElement("div");cb.className="codeblock";
      const head=document.createElement("div");head.className="codehead";
      const langEl=document.createElement("span");langEl.className="codelang";langEl.textContent=lang;
      const btns=document.createElement("div");btns.className="codebtns";
      const copyBtn=document.createElement("button");copyBtn.className="codebtn";
      copyBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>COPY';
      copyBtn.onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(code);copyBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>OK';copyBtn.classList.add("done");setTimeout(function(){copyBtn.innerHTML='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>COPY';copyBtn.classList.remove("done");},1500);};
      btns.appendChild(copyBtn);head.appendChild(langEl);head.appendChild(btns);
      const pre=document.createElement("pre");const codeEl=document.createElement("code");codeEl.textContent=code;pre.appendChild(codeEl);
      cb.appendChild(head);cb.appendChild(pre);
      container.appendChild(cb);
    }
  }
  return container;
}

/* ===== DOM ===== */
const chat=document.getElementById("chat"),wrap=document.getElementById("wrap"),inp=document.getElementById("in"),btn=document.getElementById("send"),hero=document.getElementById("hero");
const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("overlay"),sbList=document.getElementById("sbList");

/* ===== MESSAGES ===== */
function addUser(t){const r=document.createElement("div");r.className="row user";const b=document.createElement("div");b.className="bubble";b.textContent=t;r.appendChild(b);wrap.appendChild(r);bt();}
function addAI(){const r=document.createElement("div");r.className="row ai";const tb=document.createElement("div");tb.className="tools-bar";const tg=document.createElement("span");tg.className="tag";tg.textContent="KH AI";tb.appendChild(tg);const b=document.createElement("div");b.className="bubble";r.appendChild(tb);r.appendChild(b);wrap.appendChild(r);bt();return{row:r,bubble:b,toolbar:tb};}
function addAction(tb,label,handler){const b=document.createElement("button");b.className="action";b.textContent=label;b.onclick=handler;tb.appendChild(b);return b;}
function ld(){const r=document.createElement("div");r.className="row ai";r.innerHTML='<div class="loader"><div class="track"><i></i></div><div class="lbl">Memproses <span class="cursor"></span></div></div>';wrap.appendChild(r);bt();return r;}
function ty(el,node,speed){return new Promise(function(res){node.style.opacity="0";el.appendChild(node);setTimeout(function(){node.style.transition="opacity .4s";node.style.opacity="1";bt();res();},speed||50);});}

/* ===== API ===== */
async function reply(p){
  try{
    hist.push({role:"user",content:p});
    if(hist.length>20)hist=hist.slice(-20);
    const msgs=[{role:"system",content:"Kamu adalah KH AI, asisten cerdas berbahasa Indonesia. Jawab langsung, jelas, to the point. Kalau user minta kode, kasih kode dalam format markdown code block dengan nama bahasa di baris pertama."}].concat(hist);
    idToken = await currentUser.getIdToken();
    const res=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+idToken},body:JSON.stringify({messages:msgs})});
    if(res.status===429){hist.pop();document.getElementById("upgradeModal").classList.add("show");return null;}
    if(res.status===401){hist.pop();await signOut(auth);window.location.href="login.html";return null;}
    if(!res.ok){const e=await res.text();hist.pop();return "API Error "+res.status+":\n"+e;}
    const d=await res.json();
    if(d.usage){usage.used=d.usage.used;usage.limit=d.usage.limit;usage.premium=d.usage.premium;updateUsage();}
    let r="";
    if(d.choices&&d.choices[0]&&d.choices[0].message)r=d.choices[0].message.content;
    else r=JSON.stringify(d);
    hist.push({role:"assistant",content:r});
    return r;
  }catch(e){hist.pop();return "Koneksi gagal:\n"+e.message;}
}

/* ===== ACTIONS ===== */
function attachActions(tb,replyText,userMsg){
  addAction(tb,"SALIN",function(){const b=this;if(navigator.clipboard)navigator.clipboard.writeText(replyText);b.textContent="TERSALIN";b.classList.add("done");setTimeout(function(){b.textContent="SALIN";b.classList.remove("done");},1500);});
  addAction(tb,"REGENERATE",async function(){if(busy)return;busy=true;hist.pop();tb.parentElement.remove();const l2=ld();let r2="";try{r2=await reply(userMsg);}catch(e){r2="Error: "+e.message;}l2.remove();if(!r2){busy=false;return;}const n2=addAI();const c2=renderContent(r2);await ty(n2.bubble,c2,50);attachActions(n2.toolbar,r2,userMsg);busy=false;});
}

function autoTitle(t){return t.length>30?t.substring(0,30)+"...":t;}
function saveCurrentChat(){if(!currentChatId)return;const c=chats.find(x=>x.id===currentChatId);if(c){c.messages=hist;saveChats();renderSidebar();}}

/* ===== SEND ===== */
async function sd(){
  if(busy||!currentUser)return;
  const t=inp.value.trim();if(!t)return;
  if(!currentChatId){currentChatId="chat-"+Date.now();chats.unshift({id:currentChatId,title:autoTitle(t),messages:[]});saveChats();renderSidebar();}
  busy=true;btn.disabled=true;hideHero();addUser(t);inp.value="";ag();bt();
  const l=ld();let r="";
  try{r=await reply(t);}catch(e){r="Error: "+e.message;}
  l.remove();
  if(r){const n=addAI();const c=renderContent(r);await ty(n.bubble,c,50);attachActions(n.toolbar,r,t);saveCurrentChat();}
  busy=false;btn.disabled=false;inp.focus();
}

/* ===== SIDEBAR ===== */
function renderSidebar(){
  if(!chats.length){sbList.innerHTML='<div class="sb-empty">Belum ada chat</div>';return;}
  sbList.innerHTML="";
  chats.forEach(function(c){
    const item=document.createElement("div");item.className="sb-item"+(c.id===currentChatId?" active":"");
    const title=document.createElement("span");title.className="title";title.textContent=c.title;title.onclick=function(){loadChat(c.id);};
    const del=document.createElement("button");del.className="del";del.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';
    del.onclick=function(e){e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);saveChats();if(currentChatId===c.id)newChat();renderSidebar();};
    item.appendChild(title);item.appendChild(del);sbList.appendChild(item);
  });
}
function loadChat(id){
  const c=chats.find(x=>x.id===id);if(!c)return;
  currentChatId=id;hist=c.messages||[];wrap.innerHTML="";hideHero();
  hist.forEach(function(m){if(m.role==="user"){addUser(m.content);}else{const n=addAI();const cnt=renderContent(m.content);n.bubble.appendChild(cnt);}});
  bt();closeSb();
}

/* ===== SIDEBAR TOGGLE ===== */
function openSb(){sidebar.classList.add("open");overlay.classList.add("show");}
function closeSb(){sidebar.classList.remove("open");overlay.classList.remove("show");}
document.getElementById("menuBtn").onclick=openSb;
document.getElementById("sbClose").onclick=closeSb;
overlay.onclick=closeSb;

/* ===== NEW CHAT ===== */
function newChat(){if(busy)return;currentChatId=null;hist=[];wrap.innerHTML="";showHero();wrap.appendChild(hero);closeSb();renderSidebar();inp.focus();}
document.getElementById("sbNew").onclick=newChat;

/* ===== LOGOUT ===== */
document.getElementById("logoutBtn").onclick=async function(){
  if(!confirm("Yakin mau keluar?"))return;
  await signOut(auth);
  window.location.href="login.html";
};

/* ===== INPUT ===== */
inp.addEventListener("input",ag);
inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sd();}});
btn.addEventListener("click",sd);
inp.focus();
</script>
